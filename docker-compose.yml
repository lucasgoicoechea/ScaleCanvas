services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scalecanvas}
      POSTGRES_USER: ${POSTGRES_USER:-scalecanvas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scalecanvas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - scalecanvas-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scalecanvas} -d ${POSTGRES_DB:-scalecanvas}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-scalecanvas}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-scalecanvas}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-scalecanvas}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
      AI_ENABLED: ${AI_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      MUTATION_API_KEY: ${MUTATION_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  scalecanvas-postgres:
