server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: scalecanvas
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:scalecanvas;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    urls:
      - url: /v3/api-docs
        name: ScaleCanvas API
  show-actuator: true

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
  rule-catalog-version: 1.0.0
  security:
    mutation-api-key: ${MUTATION_API_KEY:}
  integrations:
    github-enabled: ${GITHUB_ENABLED:false}
    github-token: ${GITHUB_TOKEN:}
    github-repository: ${GITHUB_REPOSITORY:}
    sonarqube-enabled: ${SONARQUBE_ENABLED:false}
    sonarqube-url: ${SONARQUBE_URL:}
    sonarqube-token: ${SONARQUBE_TOKEN:}
    sonarqube-project: ${SONARQUBE_PROJECT:}
  ai:
    enabled: ${AI_ENABLED:false}
    ollama-base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${AI_MODEL:qwen3.5:9b}
    providers: ollama

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n"
  level:
    com.scalecanvas: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
